[package]
name = "crop-tracking"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.12"
prost-types = "0.12"
chrono = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
prost-build = "0.12"

[[bin]]
name = "build-simple-input-data"
path = "src/bin/build-simple-input-data.rs"

[[bin]]
name = "build-noisy-as-fuck-input-data"
path = "src/bin/build-noisy-as-fuck-input-data.rs"
